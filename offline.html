<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b5e20">
<meta name="color-scheme" content="light">
<title>فلاح DZ — لا يوجد اتصال</title>
<style>
:root{--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#f2f5f0;color:#1b5e20;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;text-align:center;padding:calc(24px + var(--safe-top)) 24px calc(24px + var(--safe-bottom))}
h1{font-size:1.6rem;margin:0 0 8px}
p{color:#4a5a4a;margin:0 0 24px;font-size:15px;line-height:1.7;max-width:420px}
button{background:#1b5e20;color:#fff;border:none;border-radius:12px;padding:12px 28px;font-size:16px;cursor:pointer;font-family:inherit;touch-action:manipulation}
.small{margin-top:18px;font-size:12px;color:#607d60}
</style>
</head>
<body>
<h1>🌾 لا يوجد اتصال بالإنترنت</h1>
<p>تحقّق من اتصالك ثم أعد المحاولة. بيانات المزرعة المحفوظة محليًا تظل متاحة عند رجوعك للتطبيق.</p>
<button onclick="location.reload()">إعادة المحاولة</button>
<div class="small">فلاح DZ</div>
</body>
</html>
